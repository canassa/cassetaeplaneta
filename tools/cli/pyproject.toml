[project]
name = "noite"
version = "0.1.0"
description = "noite — port tracker for the Zig rewrite of NOITE.EXE"
requires-python = ">=3.14"
dependencies = ["typer>=0.15"]

[project.scripts]
noite = "noite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noite"]
