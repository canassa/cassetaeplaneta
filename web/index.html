<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casseta &amp; Planeta — Noite Animal</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #ddd;
    font: 15px/1.4 system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block;
    background: #000; touch-action: none; cursor: default;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  .panel { position: absolute; max-width: 30rem; width: calc(100% - 32px); padding: 1.25rem 1.5rem;
    background: #111; border: 1px solid #333; border-radius: 8px; box-sizing: border-box; }
  .panel h1 { font-size: 1.1rem; margin: 0 0 .75rem; color: #fff; }
  .bar { height: 10px; background: #222; border-radius: 5px; overflow: hidden; margin: .75rem 0 .5rem; }
  .bar > div { height: 100%; width: 0; background: #e8b830; transition: width .15s; }
  .stats { font-variant-numeric: tabular-nums; color: #aaa; font-size: .9rem; }
  .error { color: #ff8070; white-space: pre-wrap; }
  #report { font-size: 11px; line-height: 1.3; max-height: 40vh; overflow: auto; white-space: pre-wrap;
    color: #bbb; background: #000; padding: .5rem; border-radius: 4px; user-select: text; -webkit-user-select: text; }
  button { font: inherit; padding: .4rem 1rem; margin-top: .75rem; background: #e8b830; color: #000;
    border: 0; border-radius: 4px; cursor: pointer; }
  button:disabled { background: #555; color: #aaa; cursor: default; }
  fieldset { border: 0; margin: 1rem 0 0; padding: 0; }
  legend { padding: 0; margin-bottom: .35rem; color: #fff; }
  label { display: flex; gap: .5rem; align-items: baseline; margin: .3rem 0; cursor: pointer; }
  label small { color: #999; }
  input { accent-color: #e8b830; }
  /* The version switch and the fullscreen button: docked in the letterbox
     when it has room (placed by fit() in noite.js), else a faint overlay
     in the top right corner that lights up on hover or tap. */
  #tools { position: fixed; display: flex; gap: 4px; z-index: 1; font-size: 12px; line-height: 16px; }
  #tools.column { flex-direction: column; align-items: flex-end; }
  #tools button { margin: 0; padding: 1px 7px; height: 18px; box-sizing: border-box; font-size: inherit;
    line-height: inherit; white-space: nowrap; background: rgba(40, 40, 40, .85); color: #ccc;
    border: 1px solid #444; border-radius: 4px; }
  #tools button:hover, #tools button:focus-visible { color: #000; background: #e8b830; border-color: #e8b830; }
  #tools.overlay { opacity: .35; transition: opacity .2s; }
  #tools.overlay:hover, #tools.overlay:focus-within, #tools.overlay.lit { opacity: 1; }
  /* A short note over the bottom of the page (a report saved, a snapshot
     being packed), with an optional button. */
  #toast { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 2;
    max-width: calc(100% - 32px); box-sizing: border-box; padding: .4rem .75rem; font-size: 13px;
    background: rgba(20, 20, 20, .92); color: #ddd; border: 1px solid #444; border-radius: 6px;
    display: flex; gap: .5rem; align-items: center; }
  #toast button { margin: 0; padding: .2rem .6rem; font-size: inherit; }
  /* Arrows for a touch screen (one-button mode): they walk like the
     keyboard's, around what a tap's straight walk bumps into. Beside or
     below the game, bottom right (placed by fit() in noite.js). */
  #dpad { position: fixed; display: grid; grid-template: repeat(3, 44px) / repeat(3, 44px); gap: 2px;
    z-index: 1; touch-action: none; user-select: none; -webkit-user-select: none; }
  #dpad button { margin: 0; padding: 0; font-size: 20px; line-height: 1; color: #ccc;
    background: rgba(40, 40, 40, .85); border: 1px solid #555; border-radius: 8px; touch-action: none; }
  #dpad button.on { color: #000; background: #e8b830; border-color: #e8b830; }
  #dpad [data-key="38"] { grid-area: 1 / 2; }
  #dpad [data-key="37"] { grid-area: 2 / 1; }
  #dpad [data-key="39"] { grid-area: 2 / 3; }
  #dpad [data-key="40"] { grid-area: 3 / 2; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="screen" width="638" height="459" hidden></canvas>
  <div id="loader" class="panel">
    <h1>Casseta &amp; Planeta — Noite Animal</h1>
    <div id="status">Preparando…</div>
    <div class="bar"><div id="bar"></div></div>
    <div id="stats" class="stats"></div>
    <div id="error" class="error" hidden></div>
    <pre id="report" hidden></pre>
    <button id="retry" hidden>Tentar de novo</button>
    <div id="options">
      <fieldset>
        <legend>Versão</legend>
        <label><input type="radio" name="versao" value="original" checked>
          <span>Original <small>— fiel ao jogo de 1995, com os bugs dele</small></span></label>
        <label><input type="radio" name="versao" value="corrigida">
          <span>Corrigida <small>— com os bugs do original consertados</small></span></label>
      </fieldset>
      <fieldset>
        <label><input type="checkbox" id="skip" checked>
          <span>Pular vídeos com clique ou Esc</span></label>
        <label><input type="checkbox" id="onebutton">
          <span>Controle com um botão <small>— para telas de toque: o clique faz tudo, toque no item e depois onde usá-lo</small></span></label>
      </fieldset>
      <button id="play">Jogar</button>
      <label id="restore" hidden>Restaurar um estado salvo (.noitesnap):
        <input type="file" id="snapfile" accept=".noitesnap,application/octet-stream"></label>
    </div>
  </div>
  <div id="away" class="panel" hidden>
    <h1>Minijogo</h1>
    <div>Os minijogos não fazem parte desta versão: o jogo continua como se você tivesse vencido.</div>
  </div>
</div>
<div id="tools" hidden>
  <button id="switch"></button>
  <button id="reportbtn" title="Baixar um relatório do jogo agora (cena, itens, imagem da tela) para mandar junto com a descrição do problema">Relatório</button>
  <button id="snapbtn" title="Baixar o estado completo do jogo (alguns MB), para reproduzir o problema exatamente" hidden>Estado completo</button>
  <button id="morebtn" title="Mais opções" aria-expanded="false">⋯</button>
  <button id="fullscreen" title="Tela cheia" hidden>⛶</button>
</div>
<div id="toast" hidden><span id="toasttext"></span><button id="toastbtn" hidden></button></div>
<div id="dpad" hidden>
  <button data-key="38" aria-label="Cima">▲</button>
  <button data-key="37" aria-label="Esquerda">◀</button>
  <button data-key="39" aria-label="Direita">▶</button>
  <button data-key="40" aria-label="Baixo">▼</button>
</div>
<script src="noite.js"></script>
</body>
</html>
